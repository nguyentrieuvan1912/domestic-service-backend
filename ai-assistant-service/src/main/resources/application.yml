server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: ai-assistant-service
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/ai_db
    username: ${AI_DB_USER:ai_app}
    password: ${AI_DB_PASSWORD:local_ai_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
clients:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  finance:
    base-url: ${FINANCE_SERVICE_URL:http://localhost:8084}
