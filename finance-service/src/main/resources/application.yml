server:
  port: ${SERVER_PORT:8084}
payments:
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    api-token: ${SEPAY_API_TOKEN:}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    bank-account-id: ${SEPAY_BANK_ACCOUNT_ID:}
    source-account: ${SEPAY_SOURCE_ACCOUNT:}
    source-name: ${SEPAY_SOURCE_NAME:}
    tkp: ${SEPAY_TKP:}
    public-url: ${SEPAY_PUBLIC_URL:}
  payout:
    enabled: ${PAYOS_PAYOUT_ENABLED:false}
    client-id: ${PAYOS_PAYOUT_CLIENT_ID:}
    api-key: ${PAYOS_PAYOUT_API_KEY:}
    checksum-key: ${PAYOS_PAYOUT_CHECKSUM_KEY:}
    source-account: ${PAYOS_PAYOUT_SOURCE_ACCOUNT:}
    source-name: ${PAYOS_PAYOUT_SOURCE_NAME:}
    bank-bins: ${PAYOS_PAYOUT_BANK_BINS:}
    minimum: ${PAYOS_PAYOUT_MINIMUM:50000}
    maximum: ${PAYOS_PAYOUT_MAXIMUM:1000000}
  payos:
    enabled: ${PAYOS_ENABLED:false}
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    account-number: ${PAYOS_ACCOUNT_NUMBER:}
    return-url: ${PAYOS_RETURN_URL:}
    cancel-url: ${PAYOS_CANCEL_URL:}
spring:
  application:
    name: finance-service
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/finance_db
    username: ${FINANCE_DB_USER:finance_app}
    password: ${FINANCE_DB_PASSWORD:local_finance_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
clients:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  finance:
    base-url: ${FINANCE_SERVICE_URL:http://localhost:8084}
