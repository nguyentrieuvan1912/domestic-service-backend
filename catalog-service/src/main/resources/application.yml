server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: catalog-service
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/catalog_db
    username: ${CATALOG_DB_USER:catalog_app}
    password: ${CATALOG_DB_PASSWORD:local_catalog_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
clients:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  finance:
    base-url: ${FINANCE_SERVICE_URL:http://localhost:8084}
