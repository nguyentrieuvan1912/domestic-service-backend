server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/identity/**
            - id: catalog
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/catalog/**
            - id: booking
              uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/booking/**
            - id: finance
              uri: ${FINANCE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/finance/**
            - id: ai-assistant
              uri: ${AI_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/ai-assistant/**
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8086}
management:
  endpoints:
    web:
      exposure:
        include: health,info
