server:
  port: ${SERVER_PORT:8081}
community:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
identity:
  mail:
    from: ${IDENTITY_MAIL_FROM:}
  bootstrap:
    email: ${IDENTITY_BOOTSTRAP_EMAIL:}
    phone: ${IDENTITY_BOOTSTRAP_PHONE:}
    password: ${IDENTITY_BOOTSTRAP_PASSWORD:}
spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: identity-service
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/identity_db
    username: ${IDENTITY_DB_USER:identity_app}
    password: ${IDENTITY_DB_PASSWORD:local_identity_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
clients:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  finance:
    base-url: ${FINANCE_SERVICE_URL:http://localhost:8084}
